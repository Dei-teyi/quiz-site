<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>互动问答小站</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #f2eff2 0%, #797778 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    /* 粒子画布：铺满整个背景，卡片浮在它上面 */
    #particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;   /* 粒子不挡鼠标，还能点到按钮 */
    }
    .card {
      background: rgba(248, 242, 245, 0.686);
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.10);
      width: 100%;
      max-width: 560px;
      padding: 36px 32px;
      text-align: center;
      position: relative;
      z-index: 1;             /* 卡片盖在粒子上面 */
    }
    .progress-bar-wrap {
      background: #e8eef5;
      border-radius: 10px;
      height: 10px;
      margin-bottom: 28px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #14b8a6);
      border-radius: 10px;
      transition: width 0.4s ease;
    }
    .question-count {
      color: #8a94a6;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .question {
      font-size: 24px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 28px;
      line-height: 1.4;
    }
    .answers { display: flex; flex-direction: column; gap: 12px; }
    .answer-btn {
      border: 2px solid #e2e8f0;
      background: #fff;
      color: #334155;
      font-size: 17px;
      padding: 15px 20px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.18s ease;
      text-align: left;
    }
    .answer-btn:hover { border-color: #14b8a6; background: #f0fdfa; transform: translateY(-2px); }
    .answer-btn.correct { border-color: #22c55e; background: #f0fdf4; color: #166534; }
    .answer-btn.wrong { border-color: #ef4444; background: #fef2f2; color: #991b1b; }
    .feedback { margin-top: 18px; font-size: 16px; min-height: 24px; }
    .feedback.right { color: #16a34a; }
    .feedback.wrong { color: #dc2626; }
    .next-btn {
      margin-top: 8px;
      border: none;
      background: #14b8a6;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      padding: 12px 34px;
      border-radius: 12px;
      cursor: pointer;
      display: none;
      transition: background 0.18s;
    }
    .next-btn:hover { background: #0d9488; }
    /* 结果页 */
    .result-score { font-size: 64px; font-weight: 800; color: #14b8a6; margin: 10px 0; }
    .result-msg { font-size: 20px; color: #334155; margin-bottom: 24px; }
    .restart-btn {
      border: none;
      background: #2563eb;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      padding: 12px 34px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.18s;
    }
    .restart-btn:hover { background: #1d4ed8; }
    .hidden { display: none; }
    footer { margin-top: 24px; color: #9aa5b1; font-size: 12px; }
  </style>
</head>
<body>
  <!-- 粒子背景画布 -->
  <canvas id="particles"></canvas>

  <div class="card">
    <!-- 问题区 -->
    <div id="quizArea">
      <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <div class="question-count" id="questionCount"></div>
      <div class="question" id="questionText"></div>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn">下一题 →</button>
    </div>

    <!-- 结果区 -->
    <div id="resultArea" class="hidden">
      <div class="question" style="margin-bottom:8px;">答题完成！</div>
      <div class="result-score" id="finalScore">0/0</div>
      <div class="result-msg" id="resultMsg"></div>
      <button class="restart-btn" id="restartBtn">重新开始</button>
    </div>

    <footer>你的互动问答小站</footer>
  </div>

  <script>
    // =====================================================
    // 【粒子特效】想改就调这几个参数，保存刷新即可
    // =====================================================
    const PARTICLE_COUNT = 100;    // 粒子数量（越多越密，太大电脑会卡）
    const PARTICLE_SPEED = 0.5;   // 飘动速度（越大飘得越快）
    const CONNECT_DIST = 130;     // 两个粒子靠多近就连线（像素）
    const PARTICLE_COLOR = "#14b8a6"; // 粒子和连线的颜色（改这里换颜色）
    const LINE_OPACITY = 0.15;    // 连线的透明度（0~1，越大线越明显）
    const MOUSE_MODE = "attract";   // "repel"=鼠标把粒子推开，改成"attract"=把粒子吸过来
    const MOUSE_POWER = 1.0;      // 鼠标作用力强度（越大反应越猛）

    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");
    let particles = [];
    let W, H;
    let mouse = { x: -9999, y: -9999 }; // 记录鼠标位置，初始放到屏幕外
    window.addEventListener("mousemove", (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    function resizeCanvas() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      // 固定生成 PARTICLE_COUNT 个粒子（原来是空的，bug 已修）
      particles = [];
      for (let i = 0; i < PARTICLE_COUNT; i++) addParticle();
    }

    function addParticle() {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * PARTICLE_SPEED,
        vy: (Math.random() - 0.5) * PARTICLE_SPEED,
        r: Math.random() * 2 + 1   // 粒子半径 1~3
      });
    }

    function step() {
      ctx.clearRect(0, 0, W, H);

      // 移动每个粒子
      for (const p of particles) {
        // 鼠标交互：靠近鼠标的粒子被推开(repel)或吸过去(attract)
        const mdx = p.x - mouse.x;
        const mdy = p.y - mouse.y;
        const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
        const M_EFFECT = 100;   // 鼠标影响半径（像素）
        if (mdist < M_EFFECT && mdist > 0.01) {
          const force = MOUSE_POWER * (1 - mdist / M_EFFECT);
          if (MOUSE_MODE === "repel") {
            p.vx += (mdx / mdist) * force;   // 朝远离鼠标方向加速
            p.vy += (mdy / mdist) * force;
          } else {
            p.vx -= (mdx / mdist) * force;   // 朝鼠标方向加速
            p.vy -= (mdy / mdist) * force;
          }
        }

        p.x += p.vx;
        p.y += p.vy;
        // 撞到边缘就反弹
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;
      }

      // 画连线：靠得近的粒子之间连一条淡线
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const a = particles[i], b = particles[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < CONNECT_DIST) {
            ctx.strokeStyle = PARTICLE_COLOR;
            ctx.globalAlpha = (1 - dist / CONNECT_DIST) * LINE_OPACITY;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }

      // 画粒子圆点
      ctx.globalAlpha = 1;
      ctx.fillStyle = PARTICLE_COLOR;
      for (const p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(step);
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);
    requestAnimationFrame(step);
  </script>

  <script>
    // =====================================================
    // 这里是「题库」数据。想换题目，只改这一块就行。
    // 每道题的格式：{ q: 问题, options: [选项...], answer: 正确选项的下标(从0开始) }
    // =====================================================
    const questions = [
      { q: "HTML 的全称是什么？",
        options: ["超文本标记语言", "高级文本语言", "首页文本链接语言", "超链接文本语言"],
        answer: 0 },
      { q: "CSS 主要负责网页的什么？",
        options: ["结构", "样式（颜色、布局）", "逻辑和交互", "数据存储"],
        answer: 1 },
      { q: "下面哪个是 JavaScript 用来声明变量的关键字？",
        options: ["var", "variable", "let 和 const", "A 和 C 都可以"],
        answer: 3 },
      { q: "点击一个按钮后要执行代码，最常用的是哪个事件？",
        options: ["onmouseenter", "onclick", "onload", "onchange"],
        answer: 1 },
      { q: "React 是一个什么？",
        options: ["数据库", "前端 JavaScript 框架/库", "服务器", "编程语言"],
        answer: 1 }
    ];

    // ---- 以下是程序逻辑，暂时不用改 ----
    let currentIndex = 0;
    let score = 0;
    let answered = false;

    const quizArea = document.getElementById("quizArea");
    const resultArea = document.getElementById("resultArea");
    const progressBar = document.getElementById("progressBar");
    const questionCount = document.getElementById("questionCount");
    const questionText = document.getElementById("questionText");
    const answersBox = document.getElementById("answers");
    const feedback = document.getElementById("feedback");
    const nextBtn = document.getElementById("nextBtn");

    function renderQuestion() {
      answered = false;
      nextBtn.style.display = "none";
      feedback.textContent = "";
      feedback.className = "feedback";

      const q = questions[currentIndex];
      questionCount.textContent = "第 " + (currentIndex + 1) + " / " + questions.length + " 题";
      questionText.textContent = q.q;
      progressBar.style.width = ((currentIndex) / questions.length * 100) + "%";

      answersBox.innerHTML = "";
      q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "answer-btn";
        btn.textContent = opt;
        btn.addEventListener("click", () => handleAnswer(i, btn));
        answersBox.appendChild(btn);
      });
    }

    function handleAnswer(chosenIndex, btn) {
      if (answered) return;      // 防止连点
      answered = true;
      const q = questions[currentIndex];
      const allBtns = answersBox.querySelectorAll(".answer-btn");

      if (chosenIndex === q.answer) {
        score++;
        btn.classList.add("correct");
        feedback.textContent = "✅ 回答正确！";
        feedback.className = "feedback right";
      } else {
        btn.classList.add("wrong");
        allBtns[q.answer].classList.add("correct");
        feedback.textContent = "❌ 答错了，正确答案已标出。";
        feedback.className = "feedback wrong";
      }
      // 禁用所有按钮
      allBtns.forEach(b => b.style.pointerEvents = "none");

      if (currentIndex < questions.length - 1) {
        nextBtn.style.display = "inline-block";
        nextBtn.textContent = "下一题 →";
      } else {
        nextBtn.style.display = "inline-block";
        nextBtn.textContent = "查看成绩";
      }
    }

    nextBtn.addEventListener("click", () => {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        showResult();
      }
    });

    function showResult() {
      progressBar.style.width = "100%";
      quizArea.classList.add("hidden");
      resultArea.classList.remove("hidden");
      document.getElementById("finalScore").textContent = score + " / " + questions.length;
      const pct = score / questions.length;
      let msg;
      if (pct === 1) msg = "太棒了，全对！🏆";
      else if (pct >= 0.8) msg = "很厉害，继续加油！";
      else if (pct >= 0.6) msg = "不错哦，再巩固一下。";
      else msg = "没关系，重新挑战一次吧！";
      document.getElementById("resultMsg").textContent = msg;
    }

    document.getElementById("restartBtn").addEventListener("click", () => {
      currentIndex = 0;
      score = 0;
      resultArea.classList.add("hidden");
      quizArea.classList.remove("hidden");
      renderQuestion();
    });

    renderQuestion(); // 页面一打开就显示第一题
  </script>
</body>
</html>
